<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Email Partnership – Five Senses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7edea; --panel:#f8faf9; --ink:#17302c; --muted:#5a6f6a;
  --line:#c9d5d0; --accent:#8a3b4f; --accent-ink:#fff; --mark:#f3d9df;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1c1a; --panel:#172826; --ink:#e4eeea; --muted:#9ab0aa;
    --line:#2b413d; --accent:#d98a9d; --accent-ink:#1a0f12; --mark:#4a2a34;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:clamp(16px,4vw,40px);
}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:24px;grid-template-columns:320px 1fr;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
.side{position:sticky;top:24px}
@media(max-width:820px){.side{position:static}}
label{display:block;font-weight:500;margin:0 0 6px}
input{
  width:100%;padding:12px 14px;font:inherit;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--line);border-radius:8px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{margin-bottom:18px}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.btns{display:grid;gap:10px;margin-top:22px}
button{
  font:inherit;font-weight:500;padding:12px 14px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent);
}
button.primary{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:22px;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.tab{border:0;border-radius:0;padding:10px 8px;font-size:.92rem;line-height:1.25}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tab small{display:block;font-weight:400;opacity:.85}
.status{min-height:1.4em;margin-top:12px;font-size:.9rem;color:var(--accent)}
.mail{
  background:var(--panel);border:1.5px solid var(--line);border-radius:10px;
  padding:clamp(18px,3vw,32px);
}
.subject{padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line);font-weight:700}
.subject span{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.mail p{margin:0 0 14px}
.mail ul{margin:0 0 14px;padding-left:1.2em}
.mail li{margin-bottom:6px}
.mail a{color:var(--accent);word-break:break-all}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px}
.sig{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>Email partnership</h1>
    <p class="sub">Ketik nama perusahaan, email langsung siap disalin.</p>
    <div class="tabs" role="group" aria-label="Pilih template">
      <button class="tab" data-t="1" aria-pressed="true">Email 1<small>Perkenalan</small></button>
      <button class="tab" data-t="2" aria-pressed="false">Email 2<small>Follow up</small></button>
    </div>
    <div class="field">
      <label for="company">Nama perusahaan</label>
      <input id="company" type="text" placeholder="contoh: China Trip" autocomplete="off" autofocus>
    </div>
    <div class="field">
      <label for="to">Email tujuan (opsional)</label>
      <input id="to" type="email" placeholder="contoh: info@chinatrip.com" autocomplete="off">
      <div class="hint" id="threadHint"></div>
      <div class="hint">Diisi hanya jika ingin memakai tombol “Buka di aplikasi email”.</div>
    </div>
    <div class="btns">
      <button class="primary" id="copyBody">Salin isi email</button>
      <button id="copySubject">Salin subjek</button>
      <button id="openMail">Buka di aplikasi email</button>
      <button id="clear">Kosongkan</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </aside>

  <main class="mail" id="preview" aria-label="Pratinjau email"></main>
</div>

<script>
(function(){
  var SUBJECT1 = "B2B Partnership Opportunity | Indonesian Massage & Spa Experiences in Jakarta";
  var PH = "[Nama Perusahaan]";

  var treatments = [
    ["Jamu Traditional Indonesian Massage","a traditional Indonesian massage experience inspired by Indonesia\u2019s wellness heritage."],
    ["Signature Five Senses Massage","our signature massage treatment designed to promote relaxation and well-being."],
    ["Lymphatic Drainage Massage","a specialized massage designed to support lymphatic circulation."],
    ["Japanese Head Spa","a relaxing scalp and hair care experience."],
    ["Five Senses Warm Water Shirodhara","a soothing wellness treatment involving a gentle stream of warm water."],
    ["Maderotherapy Massage","a specialized massage treatment using wooden tools."],
    ["Various Spa Packages","a selection of massage, spa, and wellness packages to suit different guest preferences."]
  ];

  var contactsFull = [
    ["Address","Green Ville Blok AY No. 11, Duri Kepa, Kebon Jeruk, West Jakarta 11510, Indonesia",null],
    ["Phone","+62 21 5698 0456","tel:+622156980456"],
    ["WhatsApp","+62 813 1745 5004","https://wa.me/6281317455004"],
    ["Email","hello@fivesenses.co.id","mailto:hello@fivesenses.co.id"],
    ["Website","https://www.fivesenses.co.id/","https://www.fivesenses.co.id/"],
    ["Instagram","https://www.instagram.com/fivesensesindo/","https://www.instagram.com/fivesensesindo/"]
  ];

  // Setiap template: subject, daftar blok (["p", teks] atau ["ul"]), kontak
  var TEMPLATES = {
    1: function(c){
      return {
        subject: SUBJECT1,
        contacts: contactsFull,
        blocks: [
          ["p","Dear "+c+" Team,"],
          ["p","Warm greetings from Five Senses Art & Beauty, Jakarta, Indonesia."],
          ["p","We are Five Senses Art & Beauty, a wellness, massage, and spa establishment located in West Jakarta, Indonesia. We understand that "+c+" provides travel services for visitors traveling to Jakarta and other destinations in Indonesia. We believe that some of your guests may be interested in enjoying a relaxing massage and spa experience during their stay in Jakarta."],
          ["p","With this in mind, we would like to introduce our services and propose a potential business partnership with "+c+". We are open to discussing various cooperation models that would be mutually beneficial, such as referring guests to our spa, incorporating our treatments into your travel itineraries, or arranging special packages for your clients."],
          ["p","Some of our signature treatments and services include:"],
          ["ul"],
          ["p","We would be delighted to welcome your guests and provide them with a comfortable and relaxing wellness experience during their visit to Jakarta."],
          ["p","We sincerely hope to establish a successful partnership with "+c+". We would be happy to provide further information about our treatments, pricing, and potential cooperation arrangements at your convenience."],
          ["p","Thank you for your time and consideration. We look forward to the opportunity to work with your team."]
        ]
      };
    },
    2: function(c){
      return {
        subject: "Re: " + SUBJECT1,
        contacts: contactsFull,
        blocks: [
          ["p","Dear "+c+" Team,"],
          ["p","Warm greetings from Five Senses Art & Beauty, Jakarta, Indonesia."],
          ["p","I hope this email finds you well."],
          ["p","I am writing to kindly follow up on my previous email regarding a potential B2B partnership between "+c+" and Five Senses Art & Beauty."],
          ["p","We would love to know if your team has had a chance to review our proposal and whether this collaboration might be of interest to your company."],
          ["p","We believe our Indonesian massage and spa experiences could be a valuable addition to your travel offerings, providing your guests with an opportunity to enjoy a relaxing wellness experience during their stay in Jakarta."],
          ["p","If this opportunity is of interest, we would be delighted to share further details about our treatments, pricing, and potential partnership arrangements."],
          ["p","We would also appreciate hearing your thoughts or any feedback regarding this opportunity."],
          ["p","Thank you for your time and consideration. We look forward to hearing from you."]
        ]
      };
    }
  };

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  function buildText(tpl){
    var t = [];
    tpl.blocks.forEach(function(b){
      if(b[0]==="p"){ t.push(b[1],""); }
      else { treatments.forEach(function(r){t.push("* "+r[0]+" \u2013 "+r[1]);}); t.push(""); }
    });
    t.push("Warm regards,","Cut Luna Sabrina","Development & Marketing Team","Five Senses Art & Beauty");
    tpl.contacts.forEach(function(r){t.push(r[0]+": "+r[1]);});
    return t.join("\n");
  }

  function buildHtml(tpl, c, marked){
    function fmt(s){
      var out = esc(s);
      if(marked){ out = out.split(esc(c)).join("<mark>"+esc(c)+"</mark>"); }
      return out;
    }
    var h = "";
    tpl.blocks.forEach(function(b){
      if(b[0]==="p"){ h += "<p>"+fmt(b[1])+"</p>"; }
      else {
        h += "<ul>";
        treatments.forEach(function(r){h += "<li><b>"+esc(r[0])+"</b> \u2013 "+esc(r[1])+"</li>";});
        h += "</ul>";
      }
    });
    h += '<p class="sig">Warm regards,<br>Cut Luna Sabrina<br>Development &amp; Marketing Team<br>Five Senses Art &amp; Beauty<br>';
    tpl.contacts.forEach(function(r){
      var v = r[2] ? '<a href="'+r[2]+'">'+esc(r[1])+'</a>' : esc(r[1]);
      h += esc(r[0])+": "+v+"<br>";
    });
    return h + "</p>";
  }

  var $ = function(id){return document.getElementById(id);};
  var company = $("company"), to = $("to"), preview = $("preview"), statusEl = $("status");
  var tabs = document.querySelectorAll(".tab");
  var current = 1, timer;

  function name(){ return company.value.trim(); }
  function tpl(c){ return TEMPLATES[current](c); }

  function render(){
    var n = name();
    var t = tpl(n || PH);
    preview.innerHTML =
      '<div class="subject"><span>Subjek</span>'+esc(t.subject)+'</div>' + buildHtml(t, n || PH, true);
    $("copyBody").disabled = !n;
    $("openMail").disabled = !n;
    Array.prototype.forEach.call(tabs, function(b){
      var on = Number(b.dataset.t) === current;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function say(msg){
    statusEl.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function(){statusEl.textContent="";}, 2600);
  }

  function copyPlain(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(res,rej){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy") ? res() : rej(); }catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }

  function copyRich(html, text){
    if(navigator.clipboard && window.ClipboardItem && window.isSecureContext){
      var item = new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([text],{type:"text/plain"})
      });
      return navigator.clipboard.write([item]);
    }
    return copyPlain(text);
  }

  Array.prototype.forEach.call(tabs, function(b){
    b.addEventListener("click", function(){ current = Number(b.dataset.t); render(); });
  });

  $("copyBody").addEventListener("click", function(){
    var n = name(); if(!n) return;
    var t = tpl(n);
    copyRich(buildHtml(t,n,false), buildText(t))
      .then(function(){say("Isi email tersalin. Tinggal tempel di Gmail/Outlook.");})
      .catch(function(){say("Gagal menyalin. Coba lagi atau blok teks secara manual.");});
  });

  $("copySubject").addEventListener("click", function(){
    copyPlain(tpl(name() || PH).subject)
      .then(function(){say("Subjek tersalin.");})
      .catch(function(){say("Gagal menyalin subjek.");});
  });

  $("openMail").addEventListener("click", function(){
    var n = name(); if(!n) return;
    var t = tpl(n);
    window.location.href = "mailto:" + encodeURIComponent(to.value.trim()) +
      "?subject=" + encodeURIComponent(t.subject) +
      "&body=" + encodeURIComponent(buildText(t));
  });

  $("clear").addEventListener("click", function(){
    company.value = ""; to.value = ""; render(); company.focus();
  });

  company.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
